name: Deprem Tahmin Motoru (Updater)

on:
  # schedule:
  #   - cron: '*/5 * * * *' # Her 5 dakikada bir calistir (Gecici olarak durduruldu)
  workflow_dispatch: # Manuel olarak tetiklenebilmesi icin

jobs:
  update-database:
    runs-on: ubuntu-latest
    
    steps:
    - name: Repoyu klonla
      uses: actions/checkout@v3
      
    - name: Python kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Gereksinimleri yükle
      run: |
        python -m pip install --upgrade pip
        pip install supabase websockets==15.0 requests beautifulsoup4
        
    - name: Tahmin Motorunu (Updater) Çalıştır
      env:
        SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      run: python updater.py
