    <script>
        // Kullanıcının dahiyane fikri: Vercel cache'ini kırmak için otomatik zaman damgası (timestamp) yönlendirmesi
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const currentTime = new Date().getTime();
            let v = urlParams.get('v');
            
            // Eğer ?v parametresi yoksa veya 5 saniyeden eskiyse, en güncel zaman damgasıyla sayfayı yeniden yükle
            if (!v || (currentTime - parseInt(v)) > 5000) {
                // Sadece pathname'i alarak temiz bir yönlendirme yap
                window.location.replace(window.location.pathname + '?v=' + currentTime);
            }
        })();
    </script>

    <script>
        // Supabase Bağlantı Ayarları
        const SUPABASE_URL = "https://tiykapksaboucamusmbk.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpeWthcGtzYWJvdWNhbXVzbWJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNjUyMjEsImV4cCI6MjEwMjc0MTIyMX0.D2YkQaF5Gfn49bsRpuoi3W1upoFfhGxdFQ-pBRW6IAM";
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function init() {
            // 1. Depremleri Çek
            const { data: earthquakes, error: eqError } = await supabaseClient
                .from('earthquakes')
                .select('*')
                .order('date', { ascending: true });

            if (eqError) {
                console.error("Deprem verisi çekilemedi:", eqError);
                document.getElementById('loading').innerText = "Veri çekme hatası! Veritabanı izinlerini kontrol edin.";
                return;
            }

            // 2. Tahminleri Çek
            const { data: predictions, error: predError } = await supabaseClient
                .from('predictions')
                .select('*')
                .order('created_at', { ascending: true });

            if (predError) {
                console.error("Tahmin verisi çekilemedi:", predError);
                return;
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('data-list').style.display = 'flex';

            renderPlot(earthquakes, predictions);
            renderTable(earthquakes, predictions);
        }

        function renderPlot(data, allPredictions) {
            // Haritada sadece bekleyen (gerçekleşmemiş) tahminleri göster
            const predictions = allPredictions.filter(p => !p.matched_earthquake_id);
            
            const lats = data.map(d => d.lat);
            const lons = data.map(d => d.lon);
            const depths = data.map(d => -d.depth); 
            const mags = data.map(d => Math.max(d.mag, 0.5)); 
            const hoverTexts = data.map(d => `Tarih: ${d.date.replace('T', ' ')}<br>Büyüklük: ${d.mag}<br>Derinlik: ${d.depth} km<br>Konum: ${d.location}`);

            const N = data.length;
            // Gerçek noktalara ait üçgen köşe numarasını belirle (1, 2, 3)
            const realPointLabels = data.map((d, i) => ((i % 3) + 1).toString());

            // Gerçek Noktalar
            const trace = {
                x: lons, y: lats, z: depths,
                mode: 'markers',
                marker: {
                    size: mags.map(m => m * 4), 
                    color: depths, 
                    colorscale: 'Jet', 
                    opacity: 0.8,
                    symbol: 'circle',
                    line: { color: 'rgba(255, 255, 255, 0.5)', width: 1 }
                },
                hovertext: hoverTexts,
                hoverinfo: 'text',
                type: 'scatter3d',
                name: 'Gerçek Depremler'
            };

            // Kesik Üçgenler (Disjoint)
            const i_indices = [];
            const j_indices = [];
            const k_indices = [];
            const intensities = []; 

            const numTriangles = Math.floor(N / 3);

            for (let t = 0; t < numTriangles; t++) {
                i_indices.push(t * 3);
                j_indices.push(t * 3 + 1);
                k_indices.push(t * 3 + 2);
                intensities.push(t); 
            }
            
            const traceRealMesh = {
                x: lons, y: lats, z: depths,
                i: i_indices, j: j_indices, k: k_indices,
                intensity: intensities, intensitymode: 'cell', colorscale: 'Jet',
                opacity: 0.6, type: 'mesh3d', name: 'Tamamlanmış Kırıklar', hoverinfo: 'skip'
            };

            // Tahmin Çizimleri
            const predLats = predictions.map(p => p.pred_lat);
            const predLons = predictions.map(p => p.pred_lon);
            const predDepths = predictions.map(p => -p.pred_depth);
            const predTexts = predictions.map(p => p.target_order + '?');
            
            const allLons = [...lons, ...predLons];
            const allLats = [...lats, ...predLats];
            const allDepths = [...depths, ...predDepths];

            const remainder = N % 3;
            const pred_i = [];
            const pred_j = [];
            const pred_k = [];
            let startIdx = N; 
            
            if (predictions.length > 0) {
                if (remainder === 1 && predictions.length >= 2) {
                    pred_i.push(N - 1); pred_j.push(startIdx); pred_k.push(startIdx + 1); 
                } else if (remainder === 2 && predictions.length >= 1) {
                    pred_i.push(N - 2); pred_j.push(N - 1); pred_k.push(startIdx); 
                } else if (remainder === 0 && predictions.length >= 3) {
                    pred_i.push(startIdx); pred_j.push(startIdx + 1); pred_k.push(startIdx + 2); 
                }
            }

            const tracePredMesh = {
                x: allLons, y: allLats, z: allDepths,
                i: pred_i, j: pred_j, k: pred_k,
                color: 'rgba(255, 0, 255, 0.8)', 
                opacity: 0.9, type: 'mesh3d', name: 'Tahmini Kırılma Yönü', hoverinfo: 'skip'
            };

            const tracePredPoints = {
                x: predLons, y: predLats, z: predDepths,
                mode: 'markers+text',
                marker: { size: 8, color: '#ff00ff', symbol: 'diamond' },
                text: predTexts, 
                textfont: { size: 24, color: '#ff00ff' },
                hovertext: predTexts.map(t => 'Tahmin: ' + t), hoverinfo: 'text',
                type: 'scatter3d', name: 'Tahmin Edilen Noktalar'
            };

            // Yüzey
            const minLon = Math.min(...lons) - 0.02;
            const maxLon = Math.max(...lons) + 0.02;
            const minLat = Math.min(...lats) - 0.02;
            const maxLat = Math.max(...lats) + 0.02;
            const surface = {
                x: [minLon, minLon, maxLon, maxLon],
                y: [minLat, maxLat, minLat, maxLat],
                z: [0, 0, 0, 0],
                opacity: 0.2, color: 'rgba(0, 150, 255, 0.5)', type: 'mesh3d', name: 'Deniz Yüzeyi', hoverinfo: 'name'
            };

            const layout = {
                margin: { l: 0, r: 0, b: 0, t: 0 },
                paper_bgcolor: '#050510',
                dragmode: 'turntable',
                scene: {
                    xaxis: { title: 'Boylam (Longitude)', color: '#aaaaaa', gridcolor: '#222233', zerolinecolor: '#444455', showbackground: false },
                    yaxis: { title: 'Enlem (Latitude)', color: '#aaaaaa', gridcolor: '#222233', zerolinecolor: '#444455', showbackground: false },
                    zaxis: { title: 'Derinlik (km)', color: '#aaaaaa', gridcolor: '#222233', zerolinecolor: '#444455', range: [-30, 5], showbackground: false },
                    camera: { eye: { x: 1.5, y: -1.5, z: 0.5 } },
                    aspectmode: 'cube'
                }
            };

            const config = { responsive: true, displayModeBar: true, displaylogo: false };
            Plotly.newPlot('plot-container', [surface, traceRealMesh, tracePredMesh, trace, tracePredPoints], layout, config);
        }

        function calculatePredictedTime(p, allEarthquakes) {
            // Eğer tahmin gerçekleşmişse (eşleşmişse), sadece o tahminden önceki depremleri baz al
            // Eğer tahmin bekliyorsa (eşleşmemişse), elimizdeki en güncel tüm depremleri baz al ki geleceği tahmin etsin!
            let pastEqs = p.matched_earthquake_id 
                ? allEarthquakes.filter(e => new Date(e.date) < new Date(p.created_at))
                : allEarthquakes;
                
            if (pastEqs.length < 5) return null;
            
            let sample = pastEqs.slice(0, 10);
            let totalGapMs = 0;
            for (let i = 0; i < sample.length - 1; i++) {
                totalGapMs += (new Date(sample[i].date).getTime() - new Date(sample[i+1].date).getTime());
            }
            let avgGapMs = totalGapMs / (sample.length - 1);
            let baseTime = new Date(pastEqs[0].date).getTime();
            
            // Eğer bekleyen tahminse, en son depremin üzerine 1 ortalama aralık ekleyerek gelecekteki tam zamanı bul
            let multiplier = p.matched_earthquake_id ? p.target_order : 1;
            let predTimeMs = baseTime + (multiplier * avgGapMs);
            return new Date(predTimeMs);
        }

        function formatTimeDiff(ms) {
            let sign = ms > 0 ? '+' : '';
            let absMs = Math.abs(ms);
            let mins = Math.round(absMs / 60000);
            if (mins < 60) return sign + mins + ' dk';
            let hours = (mins / 60).toFixed(1);
            return sign + hours + ' sa';
        }

        function renderTable(data, allPredictions) {
            const tbody = document.getElementById('data-table-body');
            let rowsHtml = '';
            const N = data.length;
            
            // 1. Sadece Bekleyen Tahminleri Ayır ve Kullanıcının İstediği Gibi SADECE 1 TANESİNİ Göster
            const pendingPredictions = allPredictions.filter(p => !p.matched_earthquake_id);
            // Sadece sıradaki en yakın tahmini (1 adet) al
            const sortedPending = pendingPredictions.sort((a, b) => a.target_order - b.target_order).slice(0, 1);

            // Bekleyen tahminleri render et (Gerçek boş, Tahmin dolu, Fark boş)
            for (let i = 0; i < sortedPending.length; i++) {
                let p = sortedPending[i];
                let pt = calculatePredictedTime(p, data);
                let pLabel = `Tahmin ${p.target_order}`;
                if (pt) {
                    let ptStr = pt.toISOString().replace('T', ' ').substring(0, 19);
                    pLabel = `${ptStr} (${p.target_order})`;
                }
                
                rowsHtml += `<tr>
                    <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                    <td style="border-bottom: none; padding: 0;"></td>
                    <td>${pLabel}</td>
                    <td>${p.pred_lat.toFixed(4)}</td>
                    <td>${p.pred_lon.toFixed(4)}</td>
                    <td>${p.pred_depth.toFixed(1)}</td>
                    <td>${p.pred_mag.toFixed(1)}</td>
                    <td style="border-bottom: none; padding: 0;"></td>
                    <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                </tr>`;
            }
            
            // 2. Gerçek Noktalar (Geçmişe Doğru) ve Eşleşen Tahminleri
            for (let i = N - 1; i >= 0; i--) {
                let d = data[i];
                let dStr = d.date.replace('T', ' ');
                let shortDate = dStr.substring(0, 19); 
                let nodeNumber = (i % 3) + 1; 
                let dateLabel = `<span style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 5px; margin-right: 5px;">${nodeNumber}</span>` + shortDate;
                
                // Bu gerçek depreme önceden atanmış bir tahmin var mı?
                let matchedPred = allPredictions.find(p => p.matched_earthquake_id === d.id);
                
                let pLabel = '-', pLat = '-', pLon = '-', pDep = '-', pMag = '-';
                let difTime = '-', difLat = '-', difLon = '-', difDep = '-', difMag = '-';
                
                if (matchedPred) {
                    let pt = calculatePredictedTime(matchedPred, data);
                    pLabel = `Tahmin ${matchedPred.target_order}`;
                    if (pt) {
                        let ptStr = pt.toISOString().replace('T', ' ').substring(0, 19);
                        pLabel = `${ptStr} (${matchedPred.target_order})`;
                        let timeDiffMs = new Date(d.date).getTime() - pt.getTime();
                        difTime = formatTimeDiff(timeDiffMs);
                    }
                    
                    pLat = matchedPred.pred_lat.toFixed(4);
                    pLon = matchedPred.pred_lon.toFixed(4);
                    pDep = matchedPred.pred_depth.toFixed(1);
                    pMag = matchedPred.pred_mag.toFixed(1);
                    
                    let dLatVal = d.lat - matchedPred.pred_lat;
                    let dLonVal = d.lon - matchedPred.pred_lon;
                    let dDepVal = d.depth - matchedPred.pred_depth;
                    let dMagVal = d.mag - matchedPred.pred_mag;
                    
                    difLat = (dLatVal > 0 ? '+' : '') + dLatVal.toFixed(4);
                    difLon = (dLonVal > 0 ? '+' : '') + dLonVal.toFixed(4);
                    difDep = (dDepVal > 0 ? '+' : '') + dDepVal.toFixed(1);
                    difMag = (dMagVal > 0 ? '+' : '') + dMagVal.toFixed(1);
                }
                
                rowsHtml += `<tr>
                    <td>${dateLabel}</td>
                    <td>${d.lat.toFixed(4)}</td>
                    <td>${d.lon.toFixed(4)}</td>
                    <td>${d.depth.toFixed(1)}</td>
                    <td>${d.mag.toFixed(1)}</td>
                    
                    <td style="border-bottom: none; padding: 0;"></td>
                    
                    <td>${pLabel}</td>
                    <td>${pLat}</td>
                    <td>${pLon}</td>
                    <td>${pDep}</td>
                    <td>${pMag}</td>
                    
                    <td style="border-bottom: none; padding: 0;"></td>
                    
                    <td>${difTime}</td>
                    <td>${difLat}</td>
                    <td>${difLon}</td>
                    <td>${difDep}</td>
                    <td>${difMag}</td>
                </tr>`;
            }
            tbody.innerHTML = rowsHtml;
        }

        // --- Drag and Drop ve Gizleme Özellikleri ---
        function hidePanel() {
            document.getElementById('data-list').style.display = 'none';
            document.getElementById('show-panel-btn').style.display = 'block';
        }

        function showPanel() {
            document.getElementById('data-list').style.display = 'flex';
            document.getElementById('show-panel-btn').style.display = 'none';
        }

        const dragElement = document.getElementById("data-list");
        const dragHeader = document.getElementById("data-list-header");
        
        // Tablo (kart) üzerinde yapılan hiçbir fare/tekerlek hareketinin arkadaki 3D haritaya geçmesini engelle
        dragElement.addEventListener('mousedown', function(e) { 
            e.stopPropagation(); 
            document.getElementById('plot-container').style.pointerEvents = 'none'; // Plotly'yi tamamen dondur
        });
        dragElement.addEventListener('wheel', function(e) { e.stopPropagation(); });
        dragElement.addEventListener('touchstart', function(e) { 
            e.stopPropagation(); 
            document.getElementById('plot-container').style.pointerEvents = 'none';
        });
        dragElement.addEventListener('touchmove', function(e) { e.stopPropagation(); });

        // Fare/parmak bırakıldığında Plotly'yi tekrar aktif et
        window.addEventListener('mouseup', function(e) {
            document.getElementById('plot-container').style.pointerEvents = 'auto';
        });
        window.addEventListener('touchend', function(e) {
            document.getElementById('plot-container').style.pointerEvents = 'auto';
        });

        // --- PANEL DURUMUNU (POS & BOYUT) HAFIZADA TUTMA ---
        function savePanelState() {
            localStorage.setItem('panel_left', dragElement.style.left);
            localStorage.setItem('panel_top', dragElement.style.top);
            localStorage.setItem('panel_width', dragElement.style.width);
            localStorage.setItem('panel_height', dragElement.style.height);
        }
        
        function loadPanelState() {
            const left = localStorage.getItem('panel_left');
            const top = localStorage.getItem('panel_top');
            const width = localStorage.getItem('panel_width');
            const height = localStorage.getItem('panel_height');
            
            if (left) dragElement.style.left = left;
            if (top) dragElement.style.top = top;
            if (width) dragElement.style.width = width;
            if (height) dragElement.style.height = height;
        }
        
        loadPanelState(); // Sayfa açıldığında yükle
        
        // Boyut değiştiğinde otomatik kaydet
        const resizeObserver = new ResizeObserver(() => { savePanelState(); });
        resizeObserver.observe(dragElement);
        // --- HAFIZA KODU SONU ---

        // --- SOL ALT KÖŞE (SW) YENİDEN BOYUTLANDIRICI EKLENTİSİ ---
        const resizerBL = document.createElement('div');
        resizerBL.style.width = '20px';
        resizerBL.style.height = '20px';
        resizerBL.style.position = 'absolute';
        resizerBL.style.bottom = '0';
        resizerBL.style.left = '0';
        resizerBL.style.cursor = 'sw-resize';
        resizerBL.style.zIndex = '1001';
        // Görsel ipucu (hafif eğimli çizgiler gibi veya sadece boş alan)
        resizerBL.style.background = 'linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.2) 45%, rgba(255,255,255,0.2) 55%, transparent 60%)';
        dragElement.appendChild(resizerBL);
        
        resizerBL.addEventListener('mousedown', initResizeBL);
        
        function initResizeBL(e) {
            e.stopPropagation();
            e.preventDefault();
            window.addEventListener('mousemove', resizeBL);
            window.addEventListener('mouseup', stopResizeBL);
            document.getElementById('plot-container').style.pointerEvents = 'none';
        }
        
        function resizeBL(e) {
            e.stopPropagation();
            const rect = dragElement.getBoundingClientRect();
            const newWidth = rect.right - e.clientX;
            const newHeight = e.clientY - rect.top;
            
            if (newWidth > 300) { 
                dragElement.style.width = newWidth + 'px';
                dragElement.style.left = e.clientX + 'px';
            }
            if (newHeight > 100) { 
                dragElement.style.height = newHeight + 'px';
            }
        }
        
        function stopResizeBL(e) {
            window.removeEventListener('mousemove', resizeBL);
            window.removeEventListener('mouseup', stopResizeBL);
            document.getElementById('plot-container').style.pointerEvents = 'auto';
        }
        // --- SOL ALT KÖŞE BOYUTLANDIRICI SONU ---

        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        dragHeader.onmousedown = dragMouseDown;

        function dragMouseDown(e) {
            e.preventDefault();
            e.stopPropagation();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
            dragHeader.style.cursor = 'grabbing';
        }

        function elementDrag(e) {
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            
            dragElement.style.top = (dragElement.offsetTop - pos2) + "px";
            dragElement.style.left = (dragElement.offsetLeft - pos1) + "px";
            dragElement.style.right = 'auto'; // Disable default right anchoring
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
            dragHeader.style.cursor = 'grab';
            savePanelState();
        }

        // --- OTOMATİK SAYFA YENİLEME (Vercel Deploy Takibi) ---
        let currentHTML = null;
        setInterval(() => {
            // Vercel başlıkları gizleyebildiği için ETag yerine direkt dosyanın içeriğini (saf halini) kontrol ediyoruz
            fetch(window.location.pathname + '?ping=' + new Date().getTime())
            .then(res => res.text())
            .then(html => {
                if (!currentHTML) {
                    currentHTML = html;
                } else if (html !== currentHTML) {
                    console.log("Yeni kod algılandı, sayfa yenileniyor...");
                    window.location.href = window.location.pathname + '?v=' + new Date().getTime();
                }
            })
            .catch(err => {});
        }, 10000); // Her 10 saniyede bir kontrol et

        // Sistemi başlat
        init();
    </script>
</body>
</html>
