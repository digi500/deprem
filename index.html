<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marmara / Adalar Sismik Aktivite & Tahmin Sistemi</title>
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #plot-container {
            width: 100vw;
            height: 100vh;
        }
        
        #data-list {
            position: absolute; 
            top: 20px; 
            right: 20px; 
            width: 420px; 
            height: 85vh; 
            overflow-y: auto; 
            background: rgba(10,15,30,0.85); 
            border-radius: 12px; 
            color: #ddd; 
            font-size: 13px; 
            padding: 20px; 
            border: 1px solid rgba(100,150,255,0.3); 
            z-index: 1000; 
            display: flex; 
            flex-direction: column;
            box-shadow: -5px 5px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
        }
        
        #data-list h3 {
            color: #4facfe; 
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 1.3rem;
            text-align: center;
        }
        
        .status {
            text-align: center;
            font-size: 0.85rem;
            color: #44ee44;
            margin-bottom: 15px;
            font-weight: bold;
        }

        table {
            width: 100%; 
            border-collapse: collapse;
        }
        
        th {
            border-bottom: 2px solid #555; 
            text-align: left;
            padding-bottom: 8px;
            color: #aaa;
        }
        
        td {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #4facfe; 
            border-radius: 4px;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: #4facfe;
            z-index: 2000;
        }
    </style>
</head>
<body>
    <div id="loading">Sistem Verileri Yükleniyor...</div>
    <div id="plot-container"></div>
    
    <div id="data-list" style="display: none;">
        <h3>Sismik Aktivite & Tahmin Motoru</h3>
        <div class="status">⚡ Canlı Supabase Bağlantısı Aktif</div>
        <table>
            <thead>
                <tr>
                    <th>Zaman/Durum</th><th>Enlem</th><th>Boylam</th><th>Der.</th><th>Mag</th>
                </tr>
            </thead>
            <tbody id="data-table-body">
            </tbody>
        </table>
    </div>

    <script>
        // Supabase Bağlantı Ayarları
        const SUPABASE_URL = "https://tiykapksaboucamusmbk.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpeWthcGtzYWJvdWNhbXVzbWJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNjUyMjEsImV4cCI6MjEwMjc0MTIyMX0.D2YkQaF5Gfn49bsRpuoi3W1upoFfhGxdFQ-pBRW6IAM";
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function init() {
            // 1. Depremleri Çek
            const { data: earthquakes, error: eqError } = await supabaseClient
                .from('earthquakes')
                .select('*')
                .order('date', { ascending: true });

            if (eqError) {
                console.error("Deprem verisi çekilemedi:", eqError);
                document.getElementById('loading').innerText = "Veri çekme hatası! Veritabanı izinlerini kontrol edin.";
                return;
            }

            // 2. Tahminleri Çek
            const { data: predictions, error: predError } = await supabaseClient
                .from('predictions')
                .select('*')
                .is('matched_earthquake_id', null)
                .order('created_at', { ascending: true });

            if (predError) {
                console.error("Tahmin verisi çekilemedi:", predError);
                return;
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('data-list').style.display = 'flex';

            renderPlot(earthquakes, predictions);
            renderTable(earthquakes, predictions);
        }

        function renderPlot(data, predictions) {
            const lats = data.map(d => d.lat);
            const lons = data.map(d => d.lon);
            const depths = data.map(d => -d.depth); 
            const mags = data.map(d => Math.max(d.mag, 0.5)); 
            const hoverTexts = data.map(d => `Tarih: ${d.date.replace('T', ' ')}<br>Büyüklük: ${d.mag}<br>Derinlik: ${d.depth} km<br>Konum: ${d.location}`);

            const N = data.length;
            const realPointLabels = data.map((d, i) => i === (N - 1) ? '1' : '');

            // Gerçek Noktalar
            const trace = {
                x: lons, y: lats, z: depths,
                mode: 'markers+text',
                marker: {
                    size: mags.map(m => m * 4), 
                    color: depths, 
                    colorscale: 'Jet', 
                    opacity: 0.8,
                    symbol: 'circle',
                    line: { color: 'rgba(255, 255, 255, 0.5)', width: 1 }
                },
                text: realPointLabels,
                textfont: { size: 24, color: 'white' },
                textposition: 'top center',
                hovertext: hoverTexts,
                hoverinfo: 'text',
                type: 'scatter3d'
            };

            // Kesik Üçgenler (Disjoint)
            const i_indices = [];
            const j_indices = [];
            const k_indices = [];
            const intensities = []; 

            const numTriangles = Math.floor(N / 3);

            for (let t = 0; t < numTriangles; t++) {
                i_indices.push(t * 3);
                j_indices.push(t * 3 + 1);
                k_indices.push(t * 3 + 2);
                intensities.push(t); 
            }
            
            const traceRealMesh = {
                x: lons, y: lats, z: depths,
                i: i_indices, j: j_indices, k: k_indices,
                intensity: intensities, intensitymode: 'cell', colorscale: 'Jet',
                opacity: 0.6, type: 'mesh3d', name: 'Tamamlanmış Kırıklar', hoverinfo: 'skip'
            };

            // Tahmin Çizimleri
            const predLats = predictions.map(p => p.pred_lat);
            const predLons = predictions.map(p => p.pred_lon);
            const predDepths = predictions.map(p => -p.pred_depth);
            const predTexts = predictions.map(p => p.target_order + '?');
            
            const allLons = [...lons, ...predLons];
            const allLats = [...lats, ...predLats];
            const allDepths = [...depths, ...predDepths];

            const remainder = N % 3;
            const pred_i = [];
            const pred_j = [];
            const pred_k = [];
            let startIdx = N; 
            
            if (predictions.length > 0) {
                if (remainder === 1 && predictions.length >= 2) {
                    pred_i.push(N - 1); pred_j.push(startIdx); pred_k.push(startIdx + 1); 
                } else if (remainder === 2 && predictions.length >= 1) {
                    pred_i.push(N - 2); pred_j.push(N - 1); pred_k.push(startIdx); 
                } else if (remainder === 0 && predictions.length >= 3) {
                    pred_i.push(startIdx); pred_j.push(startIdx + 1); pred_k.push(startIdx + 2); 
                }
            }

            const tracePredMesh = {
                x: allLons, y: allLats, z: allDepths,
                i: pred_i, j: pred_j, k: pred_k,
                color: 'rgba(255, 0, 255, 0.8)', 
                opacity: 0.9, type: 'mesh3d', name: 'Tahmini Kırılma Yönü', hoverinfo: 'skip'
            };

            const tracePredPoints = {
                x: predLons, y: predLats, z: predDepths,
                mode: 'markers+text',
                marker: { size: 8, color: '#ff00ff', symbol: 'diamond' },
                text: predTexts, 
                textfont: { size: 24, color: 'white' },
                hovertext: predTexts.map(t => 'Tahmin: ' + t), hoverinfo: 'text',
                type: 'scatter3d', name: 'Tahmin Edilen Noktalar'
            };

            // Yüzey
            const minLon = Math.min(...lons) - 0.02;
            const maxLon = Math.max(...lons) + 0.02;
            const minLat = Math.min(...lats) - 0.02;
            const maxLat = Math.max(...lats) + 0.02;
            const surface = {
                x: [minLon, minLon, maxLon, maxLon],
                y: [minLat, maxLat, minLat, maxLat],
                z: [0, 0, 0, 0],
                opacity: 0.2, color: 'rgba(0, 150, 255, 0.5)', type: 'mesh3d', name: 'Deniz Yüzeyi', hoverinfo: 'name'
            };

            const layout = {
                margin: { l: 0, r: 0, b: 0, t: 0 },
                paper_bgcolor: '#050510',
                dragmode: 'pan',
                scene: {
                    xaxis: { title: 'Boylam (Longitude)', color: '#aaaaaa', gridcolor: '#222233', zerolinecolor: '#444455', showbackground: false },
                    yaxis: { title: 'Enlem (Latitude)', color: '#aaaaaa', gridcolor: '#222233', zerolinecolor: '#444455', showbackground: false },
                    zaxis: { title: 'Derinlik (km)', color: '#aaaaaa', gridcolor: '#222233', zerolinecolor: '#444455', range: [-30, 5], showbackground: false },
                    camera: { eye: { x: 1.5, y: -1.5, z: 0.5 } },
                    aspectmode: 'cube'
                }
            };

            const config = { responsive: true, displayModeBar: true, displaylogo: false };
            Plotly.newPlot('plot-container', [surface, traceRealMesh, tracePredMesh, trace, tracePredPoints], layout, config);
        }

        function renderTable(data, predictions) {
            const tbody = document.getElementById('data-table-body');
            let rowsHtml = '';
            const N = data.length;
            
            // Önce Tahmin Edilen Noktalar (En Üste)
            for (let i = 0; i < predictions.length; i++) {
                let p = predictions[i];
                rowsHtml += `<tr style="color: #ff00ff; font-weight: bold;">
                    <td>Tahmin ${p.target_order}?</td>
                    <td>${p.pred_lat.toFixed(4)}</td>
                    <td>${p.pred_lon.toFixed(4)}</td>
                    <td>${p.pred_depth.toFixed(1)}</td>
                    <td>${p.pred_mag.toFixed(1)}</td>
                </tr>`;
            }
            
            // Sonra Gerçek Noktalar (Yeniden Eskiye, N-1'den 0'a doğru)
            for (let i = N - 1; i >= 0; i--) {
                let d = data[i];
                let dStr = d.date.replace('T', ' ');
                let shortDate = dStr.substring(5, 16); 
                
                let dateLabel = (i === N - 1) ? `<span style="background: white; color: black; padding: 2px 6px; border-radius: 50%; font-weight: bold; margin-right: 5px;">1</span>` + shortDate : shortDate;
                
                rowsHtml += `<tr>
                    <td>${dateLabel}</td>
                    <td>${d.lat.toFixed(4)}</td>
                    <td>${d.lon.toFixed(4)}</td>
                    <td>${d.depth.toFixed(1)}</td>
                    <td>${d.mag.toFixed(1)}</td>
                </tr>`;
            }
            tbody.innerHTML = rowsHtml;
        }

        // Sistemi başlat
        init();
    </script>
</body>
</html>
