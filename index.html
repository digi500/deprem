<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marmara / Adalar Bölgesi 3 Boyutlu Deprem Aktivitesi</title>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #plot-container {
            width: 100vw;
            height: 100vh;
        }
        
        #data-list {
            position: absolute; 
            top: 20px; 
            right: 20px; 
            width: 380px; 
            height: 85vh; 
            overflow-y: auto; 
            background: rgba(10,15,30,0.85); 
            border-radius: 8px; 
            color: #ddd; 
            font-size: 13px; 
            padding: 15px; 
            border: 1px solid rgba(100,150,255,0.3); 
            z-index: 1000; 
            display: flex; 
            flex-direction: column;
            box-shadow: -5px 5px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        
        #data-list h3 {
            color: #4facfe; 
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.2rem;
            text-align: center;
        }
        
        table {
            width: 100%; 
            border-collapse: collapse;
        }
        
        th {
            border-bottom: 2px solid #555; 
            text-align: left;
            padding-bottom: 8px;
            color: #aaa;
        }
        
        td {
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #4facfe; 
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="plot-container"></div>
    
    <div id="data-list">
        <h3>Sismik Aktivite & Tahminler</h3>
        <table>
            <thead>
                <tr>
                    <th>Zaman/Durum</th><th>Enlem</th><th>Boylam</th><th>Der.</th><th>Mag</th>
                </tr>
            </thead>
            <tbody id="data-table-body">
            </tbody>
        </table>
    </div>

    <script>
        const rawData = [{"date": "2026-08-19T21:36:04", "lat": 40.7747, "lon": 29.0915, "depth": 9.3, "mag": 2.0, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-19T21:09:39", "lat": 40.7785, "lon": 29.0973, "depth": 12.1, "mag": 2.0, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-19T20:58:26", "lat": 40.7725, "lon": 29.1003, "depth": 11.2, "mag": 2.5, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-19T20:51:16", "lat": 40.7883, "lon": 29.0863, "depth": 13.6, "mag": 1.2, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-19T20:21:24", "lat": 40.7725, "lon": 29.1085, "depth": 10.2, "mag": 1.2, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-19T20:04:58", "lat": 40.7745, "lon": 29.1035, "depth": 4.4, "mag": 2.2, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-19T20:02:55", "lat": 40.7722, "lon": 29.0825, "depth": 10.6, "mag": 1.7, "location": "CINARCIK ACIKLARI-YALOVA (MARMARA DENIZI)"}, {"date": "2026-08-19T19:48:27", "lat": 40.7813, "lon": 29.0877, "depth": 11.8, "mag": 1.5, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-19T19:47:09", "lat": 40.7697, "lon": 29.0927, "depth": 12.3, "mag": 1.4, "location": "CINARCIK ACIKLARI-YALOVA (MARMARA DENIZI)"}, {"date": "2026-08-19T19:32:19", "lat": 40.7707, "lon": 29.0817, "depth": 8.8, "mag": 1.1, "location": "CINARCIK ACIKLARI-YALOVA (MARMARA DENIZI)"}, {"date": "2026-08-19T19:28:12", "lat": 40.7717, "lon": 29.0918, "depth": 12.4, "mag": 1.3, "location": "CINARCIK ACIKLARI-YALOVA (MARMARA DENIZI)"}, {"date": "2026-08-19T19:21:56", "lat": 40.7717, "lon": 29.0923, "depth": 8.8, "mag": 1.8, "location": "CINARCIK ACIKLARI-YALOVA (MARMARA DENIZI)"}, {"date": "2026-08-19T19:17:26", "lat": 40.7803, "lon": 29.1102, "depth": 10.1, "mag": 2.7, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-19T19:11:40", "lat": 40.7687, "lon": 29.1137, "depth": 9.2, "mag": 1.5, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-19T18:56:07", "lat": 40.4255, "lon": 28.8468, "depth": 11.0, "mag": 2.0, "location": "GEMLIK KORFEZI (MARMARA DENIZI)"}, {"date": "2026-08-19T18:42:56", "lat": 40.7752, "lon": 29.0992, "depth": 10.1, "mag": 1.6, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-19T18:26:19", "lat": 40.7797, "lon": 29.0507, "depth": 17.3, "mag": 1.4, "location": "CINARCIK ACIKLARI-YALOVA (MARMARA DENIZI)"}, {"date": "2026-08-19T18:18:43", "lat": 40.7665, "lon": 29.1027, "depth": 12.7, "mag": 1.5, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-19T18:13:47", "lat": 40.768, "lon": 29.1123, "depth": 8.0, "mag": 2.3, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-19T17:43:46", "lat": 40.7785, "lon": 29.1037, "depth": 11.4, "mag": 3.2, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-19T17:33:44", "lat": 40.7773, "lon": 29.1203, "depth": 9.9, "mag": 2.3, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-19T17:03:31", "lat": 40.7717, "lon": 29.1022, "depth": 12.3, "mag": 2.5, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-19T16:25:43", "lat": 40.8018, "lon": 29.1252, "depth": 12.4, "mag": 1.2, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-19T16:24:39", "lat": 40.4898, "lon": 29.1977, "depth": 0.0, "mag": 1.1, "location": "SAHINYURDU-GEMLIK (BURSA)"}, {"date": "2026-08-19T16:10:16", "lat": 40.8237, "lon": 29.1467, "depth": 12.5, "mag": 1.2, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-19T16:08:18", "lat": 40.7805, "lon": 29.1123, "depth": 5.8, "mag": 2.4, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-19T15:05:04", "lat": 40.7692, "lon": 29.093, "depth": 20.5, "mag": 1.9, "location": "CINARCIK ACIKLARI-YALOVA (MARMARA DENIZI)"}, {"date": "2026-08-18T14:37:53", "lat": 40.6152, "lon": 27.2107, "depth": 9.4, "mag": 1.0, "location": "ERIKLICE-SARKOY (TEKIRDAG)"}, {"date": "2026-08-18T13:40:34", "lat": 41.0387, "lon": 29.3252, "depth": 0.0, "mag": 1.2, "location": "KURTDOGMUS-PENDIK (ISTANBUL)"}, {"date": "2026-08-18T13:01:10", "lat": 40.829, "lon": 29.1368, "depth": 13.3, "mag": 0.9, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-18T11:05:13", "lat": 40.8348, "lon": 29.157, "depth": 11.2, "mag": 0.8, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-18T10:44:28", "lat": 40.8703, "lon": 29.1343, "depth": 14.5, "mag": 0.7, "location": "ADALAR (ISTANBUL) REVIZE01 (2026.08.18"}, {"date": "2026-08-18T10:40:03", "lat": 40.7718, "lon": 29.1268, "depth": 20.6, "mag": 1.0, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-18T09:51:15", "lat": 40.7843, "lon": 29.0418, "depth": 5.4, "mag": 1.1, "location": "CINARCIK ACIKLARI-YALOVA (MARMARA DENIZI)"}, {"date": "2026-08-18T09:03:44", "lat": 40.7662, "lon": 29.0952, "depth": 12.8, "mag": 1.4, "location": "CINARCIK ACIKLARI-YALOVA (MARMARA DENIZI)"}, {"date": "2026-08-18T09:00:26", "lat": 40.7828, "lon": 29.1293, "depth": 11.2, "mag": 1.8, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-18T07:08:58", "lat": 40.7833, "lon": 29.0802, "depth": 8.6, "mag": 1.9, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-18T07:04:12", "lat": 40.7792, "lon": 29.057, "depth": 12.0, "mag": 1.4, "location": "CINARCIK ACIKLARI-YALOVA (MARMARA DENIZI)"}, {"date": "2026-08-18T06:40:04", "lat": 40.8008, "lon": 29.0172, "depth": 10.7, "mag": 1.5, "location": "CINARCIK ACIKLARI-YALOVA (MARMARA DENIZI)"}, {"date": "2026-08-18T06:28:06", "lat": 40.7733, "lon": 29.0792, "depth": 5.7, "mag": 1.8, "location": "CINARCIK ACIKLARI-YALOVA (MARMARA DENIZI)"}, {"date": "2026-08-18T06:26:40", "lat": 40.785, "lon": 29.0788, "depth": 11.3, "mag": 1.2, "location": "ADALAR (ISTANBUL)"}, {"date": "2026-08-18T06:22:14", "lat": 40.7678, "lon": 29.0617, "depth": 6.2, "mag": 1.6, "location": "CINARCIK ACIKLARI-YALOVA (MARMARA DENIZI)"}, {"date": "2026-08-18T04:31:09", "lat": 40.8118, "lon": 27.769, "depth": 2.2, "mag": 1.4, "location": "MARMARA DENIZI"}, {"date": "2026-08-17T21:02:43", "lat": 40.6132, "lon": 29.1217, "depth": 12.6, "mag": 1.5, "location": "ORTABURUN-CINARCIK (YALOVA)"}];
        
        const data = rawData.filter(d => 
            d.lat >= 40.75 && d.lat <= 40.85 && 
            d.lon >= 29.00 && d.lon <= 29.20
        );

        data.sort((a, b) => new Date(a.date) - new Date(b.date));

        const lats = data.map(d => d.lat);
        const lons = data.map(d => d.lon);
        const depths = data.map(d => -d.depth); 
        const mags = data.map(d => Math.max(d.mag, 0.5)); 
        const hoverTexts = data.map(d => `Tarih: ${d.date.replace('T', ' ')}<br>Büyüklük: ${d.mag}<br>Derinlik: ${d.depth} km<br>Konum: ${d.location}`);

        const N = data.length;
        const realPointLabels = data.map((d, i) => i === (N - 1) ? '1' : '');

        const trace = {
            x: lons, y: lats, z: depths,
            mode: 'markers+text',
            marker: {
                size: mags.map(m => m * 4), 
                color: depths, 
                colorscale: 'Jet', 
                opacity: 0.8,
                symbol: 'circle',
                line: { color: 'rgba(255, 255, 255, 0.5)', width: 1 }
            },
            text: realPointLabels,
            textfont: { size: 24, color: 'white' },
            textposition: 'top center',
            hovertext: hoverTexts,
            hoverinfo: 'text',
            type: 'scatter3d'
        };

        // Kesik Üçgenler (Disjoint)
        const i_indices = [];
        const j_indices = [];
        const k_indices = [];
        const intensities = []; 

        const numTriangles = Math.floor(N / 3);
        const remainder = N % 3;

        for (let t = 0; t < numTriangles; t++) {
            i_indices.push(t * 3);
            j_indices.push(t * 3 + 1);
            k_indices.push(t * 3 + 2);
            intensities.push(t); 
        }

        // --- Gelişmiş Morfolojik Tahmin (Prediction) Motoru ---
        
        // 1. Ortalama adım mesafesini (üçgen boyutunu) bulalım
        let totalDist = 0;
        for(let i=1; i<N; i++) {
            totalDist += Math.sqrt(Math.pow(lons[i]-lons[i-1], 2) + Math.pow(lats[i]-lats[i-1], 2) + Math.pow(depths[i]-depths[i-1], 2));
        }
        const avgStep = totalDist / (N - 1);

        // 2. Fayın son ilerleyiş yönünü bulalım (Son 4 nokta arası vektör)
        const lookBack = Math.min(4, N);
        let dirX = lons[N-1] - lons[N-lookBack];
        let dirY = lats[N-1] - lats[N-lookBack];
        let dirZ = depths[N-1] - depths[N-lookBack];
        
        let dirLen = Math.sqrt(dirX*dirX + dirY*dirY + dirZ*dirZ);
        if(dirLen === 0) { dirX=0.01; dirY=0; dirZ=0; dirLen=0.01; }
        dirX /= dirLen; dirY /= dirLen; dirZ /= dirLen;

        const predLats = [];
        const predLons = [];
        const predDepths = [];
        const predTexts = [];
        
        let lastLon = lons[N-1];
        let lastLat = lats[N-1];
        let lastDepth = depths[N-1];
        let lastMag = data[N-1].mag;

        const pointsToPredict = remainder === 0 ? 3 : (3 - remainder); 
        
        // Geometrik olarak dağılmış bir üçgen tahmini (düz çizgi olmaması için)
        // Nokta 1: Yön vektöründe ileri
        let p1x = lastLon + dirX * avgStep;
        let p1y = lastLat + dirY * avgStep;
        let p1z = lastDepth + dirZ * avgStep;
        
        // Nokta 2: Yöne dik (orthogonal) sağa doğru açılan
        let p2x = p1x + (-dirY) * avgStep * 0.8; 
        let p2y = p1y + (dirX) * avgStep * 0.8;
        let p2z = p1z + (dirZ) * avgStep + (Math.random() - 0.5) * avgStep;
        
        // Nokta 3: Yöne dik sola doğru açılan
        let p3x = p1x + (dirY) * avgStep * 0.8;
        let p3y = p1y + (-dirX) * avgStep * 0.8;
        let p3z = p1z + (dirZ) * avgStep + (Math.random() - 0.5) * avgStep;
        
        const predictedCoords = [
            {x: p1x, y: p1y, z: p1z},
            {x: p2x, y: p2y, z: p2z},
            {x: p3x, y: p3y, z: p3z}
        ];
        
        for(let p = 0; p < pointsToPredict; p++) {
            predLons.push(predictedCoords[p].x);
            predLats.push(predictedCoords[p].y);
            predDepths.push(predictedCoords[p].z);
            predTexts.push((p + 2).toString() + '?');
        }

        const pred_i = [];
        const pred_j = [];
        const pred_k = [];
        let startIdx = N; 

        if (remainder === 1) {
            pred_i.push(N - 1); 
            pred_j.push(startIdx); 
            pred_k.push(startIdx + 1); 
        } else if (remainder === 2) {
            pred_i.push(N - 2); 
            pred_j.push(N - 1); 
            pred_k.push(startIdx); 
        } else if (remainder === 0) {
            pred_i.push(startIdx); 
            pred_j.push(startIdx + 1); 
            pred_k.push(startIdx + 2); 
        }

        const allLons = [...lons, ...predLons];
        const allLats = [...lats, ...predLats];
        const allDepths = [...depths, ...predDepths];

        const traceRealMesh = {
            x: allLons, y: allLats, z: allDepths,
            i: i_indices, j: j_indices, k: k_indices,
            intensity: intensities, intensitymode: 'cell', colorscale: 'Jet',
            opacity: 0.6, type: 'mesh3d', name: 'Tamamlanmış Kırıklar', hoverinfo: 'skip'
        };

        const tracePredMesh = {
            x: allLons, y: allLats, z: allDepths,
            i: pred_i, j: pred_j, k: pred_k,
            color: 'rgba(255, 0, 255, 0.8)', 
            opacity: 0.9, type: 'mesh3d', name: 'Tahmini Kırılma Yönü', hoverinfo: 'skip'
        };

        const tracePredPoints = {
            x: predLons, y: predLats, z: predDepths,
            mode: 'markers+text',
            marker: { size: 8, color: '#ff00ff', symbol: 'diamond' },
            text: predTexts, 
            textfont: { size: 24, color: 'white' },
            hovertext: predTexts.map(t => 'Tahmin: ' + t), hoverinfo: 'text',
            type: 'scatter3d', name: 'Tahmin Edilen Noktalar'
        };

        // Yüzey
        const minLon = Math.min(...lons) - 0.02;
        const maxLon = Math.max(...lons) + 0.02;
        const minLat = Math.min(...lats) - 0.02;
        const maxLat = Math.max(...lats) + 0.02;
        const surface = {
            x: [minLon, minLon, maxLon, maxLon],
            y: [minLat, maxLat, minLat, maxLat],
            z: [0, 0, 0, 0],
            opacity: 0.2, color: 'rgba(0, 150, 255, 0.5)', type: 'mesh3d', name: 'Deniz Yüzeyi', hoverinfo: 'name'
        };

        const layout = {
            margin: { l: 0, r: 0, b: 0, t: 0 },
            paper_bgcolor: '#050510',
            scene: {
                xaxis: { title: 'Boylam (Longitude)', color: '#aaaaaa', gridcolor: '#222233', zerolinecolor: '#444455', showbackground: false },
                yaxis: { title: 'Enlem (Latitude)', color: '#aaaaaa', gridcolor: '#222233', zerolinecolor: '#444455', showbackground: false },
                zaxis: { title: 'Derinlik (km)', color: '#aaaaaa', gridcolor: '#222233', zerolinecolor: '#444455', range: [-30, 5], showbackground: false },
                camera: { eye: { x: 1.5, y: -1.5, z: 0.5 } },
                aspectmode: 'cube'
            }
        };

        const config = { responsive: true, displayModeBar: true, displaylogo: false };
        Plotly.newPlot('plot-container', [surface, traceRealMesh, tracePredMesh, trace, tracePredPoints], layout, config);

        // --- Sağdaki Tabloyu Doldurma ---
        const tbody = document.getElementById('data-table-body');
        let rowsHtml = '';
        
        // Önce Tahmin Edilen Noktalar (En Üste)
        for (let p = pointsToPredict - 1; p >= 0; p--) {
            rowsHtml += `<tr style="color: #ff00ff; font-weight: bold;">
                <td>Tahmin ${predTexts[p]}</td>
                <td>${predLats[p].toFixed(4)}</td>
                <td>${predLons[p].toFixed(4)}</td>
                <td>${Math.abs(predDepths[p]).toFixed(1)}</td>
                <td>${lastMag.toFixed(1)} (Vars.)</td>
            </tr>`;
        }
        
        // Sonra Gerçek Noktalar (Yeniden Eskiye, N-1'den 0'a doğru)
        for (let i = N - 1; i >= 0; i--) {
            let d = data[i];
            let dStr = d.date.replace('T', ' ');
            let shortDate = dStr.substring(5, 16); // Örn: 08-19 21:36
            
            // Eğer sonuncu depremse 1 numaralı etiketi satırda da gösterelim
            let dateLabel = (i === N - 1) ? `<span style="background: white; color: black; padding: 2px 6px; border-radius: 50%; font-weight: bold; margin-right: 5px;">1</span>` + shortDate : shortDate;
            
            rowsHtml += `<tr>
                <td>${dateLabel}</td>
                <td>${d.lat.toFixed(4)}</td>
                <td>${d.lon.toFixed(4)}</td>
                <td>${d.depth.toFixed(1)}</td>
                <td>${d.mag.toFixed(1)}</td>
            </tr>`;
        }
        tbody.innerHTML = rowsHtml;
        
    </script>
</body>
</html>
