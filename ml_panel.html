<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Yönetim Paneli</title>
    <style>
        body {
            background-color: #050510;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(15, 10, 25, 0.95);
            border: 1px solid rgba(255,0,255,0.4);
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 0 30px rgba(255,0,255,0.1);
        }
        h2 {
            color: #ff00ff;
            margin-top: 0;
            border-bottom: 1px solid rgba(255,0,255,0.2);
            padding-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0.8;
            padding: 60px 0;
        }
        .content h3 {
            color: #ff00ff;
            font-size: 24px;
            margin: 10px 0;
        }
        .content p {
            text-align: center;
            max-width: 500px;
            color: #aaa;
            line-height: 1.6;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2><span style="font-size: 32px;">🧠</span> Machine Learning (ML) Yönetim Paneli</h2>
        
        <div class="content">
            <div style="font-size: 70px; margin-bottom: 20px;">⚙️</div>
            <h3>Model Ayarları Geliştirme Aşamasında</h3>
            <p>
                Buraya tahmin motorunun algoritmik ağırlıklarını (Clustering oranı, Regresyon katsayısı, Enerji sönümlenme hızı vb.) canlı olarak değiştirebileceğiniz gelişmiş kontroller eklenecektir.
            </p>
        </div>
    </div>
</body>
</html>
