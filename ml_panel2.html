<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML2 Paneli - Deprem Büyüklük/Zaman Grafiği</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .dashboard-layout {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            width: 100%;
            flex-wrap: wrap;
        }
        .panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 48%;
            min-width: 400px;
        }
        .panel-full {
            width: 98%;
        }
        h1 {
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            margin-bottom: 20px;
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
        }
        .toggle-btn {
            background: rgba(0, 85, 255, 0.2);
            border: 1px solid #0055ff;
            color: #fff;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .toggle-btn.active {
            background: #0055ff;
            box-shadow: 0 0 10px #0055ff;
        }
        .toggle-btn.depth {
            background: rgba(255, 0, 255, 0.2);
            border: 1px solid #ff00ff;
        }
        .toggle-btn.depth.active {
            background: #ff00ff;
            box-shadow: 0 0 10px #ff00ff;
        }
        .toggle-btn.lat {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
        }
        .toggle-btn.lat.active {
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }
        .toggle-btn.lon {
            background: rgba(255, 255, 0, 0.2);
            border: 1px solid #ffff00;
        }
        .toggle-btn.lon.active {
            background: #ffff00;
            box-shadow: 0 0 10px #ffff00;
            color: #000;
        }
        .chart-container {
            width: 100%;
            height: 80vh;
            background: rgba(20, 25, 40, 0.8);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.2);
            margin-bottom: 30px;
            box-sizing: border-box;
        }
        .filter-bar {
            width: 98%;
            margin: 0 auto 20px auto;
            background: rgba(20, 25, 40, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            box-shadow: 0 0 10px rgba(0,255,255,0.1);
        }
        .filter-bar input[type="datetime-local"] {
            background: #0b0f19;
            color: #00ffff;
            border: 1px solid #00ffff;
            padding: 8px;
            border-radius: 5px;
            font-family: inherit;
        }
        .filter-bar label {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="filter-bar">
        <label>Başlangıç Tarihi:</label>
        <input type="datetime-local" id="startDate">
        <label>Bitiş Tarihi:</label>
        <input type="datetime-local" id="endDate">
        <button class="toggle-btn active" onclick="applyFilter()" style="margin: 0;">Filtrele</button>
    </div>

    <div class="dashboard-layout">
        <!-- Üst Panel: Büyüklük ve Derinlik -->
        <div class="panel panel-full">
            <h1 style="font-size: 1.5rem;">Zaman vs Büyüklük/Derinlik</h1>
            <div class="controls">
                <button id="btn-mag" class="toggle-btn active" onclick="toggleDataset(0, 'btn-mag')">Büyüklük (Mag)</button>
                <button id="btn-depth" class="toggle-btn active depth" onclick="toggleDataset(1, 'btn-depth')">Derinlik (km)</button>
            </div>
            <div class="chart-container">
                <canvas id="magChart"></canvas>
            </div>
        </div>

        <!-- Sağ Panel: Enlem ve Boylam -->
        <div class="panel">
            <h1 style="font-size: 1.5rem;">Zaman vs Enlem/Boylam</h1>
            <div class="controls">
                <button id="btn-lat" class="toggle-btn active lat" onclick="toggleDatasetGeo(0, 'btn-lat')">Enlem (Lat)</button>
                <button id="btn-lon" class="toggle-btn active lon" onclick="toggleDatasetGeo(1, 'btn-lon')">Boylam (Lon)</button>
            </div>
            <div class="chart-container">
                <canvas id="geoChart"></canvas>
            </div>
        </div>

        <!-- 3. Panel: Koordinat Göçü -->
        <div class="panel">
            <h1 style="font-size: 1.5rem;">Kesişim: Göç Haritası (Lat/Lon)</h1>
            <div class="controls">
                <button class="toggle-btn active" style="background: rgba(255, 255, 255, 0.2); border: 1px solid #fff; cursor: default;">Zaman Yolculuğu (Çizgi) & Büyüklük (Nokta)</button>
            </div>
            <div class="chart-container">
                <canvas id="mapChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://tiykapksaboucamusmbk.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpeWthcGtzYWJvdWNhbXVzbWJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNjUyMjEsImV4cCI6MjEwMjc0MTIyMX0.D2YkQaF5Gfn49bsRpuoi3W1upoFfhGxdFQ-pBRW6IAM";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let myChart;
        let geoChart;
        let mapChart;

        function toggleDatasetGeo(index, btnId) {
            const isVisible = geoChart.isDatasetVisible(index);
            if (isVisible) {
                geoChart.hide(index);
                document.getElementById(btnId).classList.remove('active');
            } else {
                geoChart.show(index);
                document.getElementById(btnId).classList.add('active');
            }
        }

        function toggleDataset(index, btnId) {
            const isVisible = myChart.isDatasetVisible(index);
            if (isVisible) {
                myChart.hide(index);
                document.getElementById(btnId).classList.remove('active');
            } else {
                myChart.show(index);
                document.getElementById(btnId).classList.add('active');
            }
        }

        async function applyFilter() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            let startIso = null;
            let endIso = null;
            
            if (startDate) startIso = new Date(startDate).toISOString();
            if (endDate) endIso = new Date(endDate).toISOString();
            
            await loadChart(startIso, endIso);
        }

        async function loadChart(startDate = null, endDate = null) {
            if (myChart) myChart.destroy();
            if (geoChart) geoChart.destroy();
            if (mapChart) mapChart.destroy();

            let query = supabaseClient
                .from('earthquakes')
                .select('*')
                .order('date', { ascending: true });

            if (startDate) query = query.gte('date', startDate);
            if (endDate) query = query.lte('date', endDate);
            if (!startDate && !endDate) query = query.limit(200);
            else query = query.limit(2000);

            const { data: earthquakes, error } = await query;

            if (error) {
                console.error("Veri çekme hatası:", error);
                return;
            }

            const magnitudes = [];
            const depths = [];
            const lats = [];
            const lons = [];
            const mapData = [];

            earthquakes.forEach(eq => {
                const dateObj = new Date(eq.date);
                const timeStr = dateObj.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) + " " + dateObj.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit' });
                
                magnitudes.push({ x: dateObj, y: eq.mag });
                depths.push({ x: dateObj, y: eq.depth });
                lats.push({ x: dateObj, y: eq.lat });
                lons.push({ x: dateObj, y: eq.lon });
                
                mapData.push({
                    x: eq.lon,
                    y: eq.lat,
                    time: timeStr,
                    mag: eq.mag
                });
            });

            const ctx = document.getElementById('magChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: 'Deprem Büyüklüğü (Mag)',
                            data: magnitudes,
                            borderColor: '#0055ff', // Mavi çizgi
                            backgroundColor: 'rgba(0, 85, 255, 0.1)',
                            borderWidth: 2,
                            pointRadius: 0, 
                            pointHoverRadius: 4, 
                            fill: true,
                            tension: 0,
                            yAxisID: 'y'
                        },
                        {
                            label: 'Derinlik (km)',
                            data: depths,
                            borderColor: '#ff00ff', // Pembe çizgi
                            backgroundColor: 'rgba(255, 0, 255, 0.1)',
                            borderWidth: 2,
                            pointRadius: 0, 
                            pointHoverRadius: 4, 
                            fill: true,
                            tension: 0, // Mavi çizgi ile aynı olması için estetik kıvrımı iptal edip düz (kırık) yaptık
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            labels: { color: '#fff' }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.raw.y;
                                }
                            }
                        },
                        zoom: {
                            zoom: {
                                wheel: { enabled: true },
                                pinch: { enabled: true },
                                mode: 'x'
                            },
                            pan: {
                                enabled: true,
                                mode: 'x'
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'hour',
                                tooltipFormat: 'HH:mm - dd/MM/yyyy',
                                displayFormats: { hour: 'HH:mm (dd.MM)' }
                            },
                            ticks: { 
                                color: '#aaa',
                                maxRotation: 45,
                                minRotation: 45
                            },
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            beginAtZero: true,
                            ticks: { color: '#0055ff' },
                            grid: { color: 'rgba(0, 85, 255, 0.1)' },
                            title: {
                                display: true,
                                text: 'Büyüklük (Mag)',
                                color: '#0055ff'
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            beginAtZero: true,
                            ticks: { color: '#ff00ff' },
                            grid: { drawOnChartArea: false }, // Çizgiler birbirine girmesin
                            title: {
                                display: true,
                                text: 'Derinlik (km)',
                                color: '#ff00ff'
                            }
                        }
                    }
                }
            });

            const geoCtx = document.getElementById('geoChart').getContext('2d');
            geoChart = new Chart(geoCtx, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: 'Enlem (Latitude)',
                            data: lats,
                            borderColor: '#00ff00',
                            backgroundColor: 'rgba(0, 255, 0, 0.1)',
                            borderWidth: 2,
                            pointRadius: 0, 
                            pointHoverRadius: 4, 
                            fill: false,
                            tension: 0,
                            yAxisID: 'y'
                        },
                        {
                            label: 'Boylam (Longitude)',
                            data: lons,
                            borderColor: '#ffff00',
                            backgroundColor: 'rgba(255, 255, 0, 0.1)',
                            borderWidth: 2,
                            pointRadius: 0, 
                            pointHoverRadius: 4, 
                            fill: false,
                            tension: 0,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { labels: { color: '#fff' } },
                        tooltip: {
                            callbacks: {
                                label: function(context) { return context.dataset.label + ': ' + context.raw.y; }
                            }
                        },
                        zoom: {
                            zoom: {
                                wheel: { enabled: true },
                                pinch: { enabled: true },
                                mode: 'x'
                            },
                            pan: {
                                enabled: true,
                                mode: 'x'
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'hour',
                                tooltipFormat: 'HH:mm - dd/MM/yyyy',
                                displayFormats: { hour: 'HH:mm (dd.MM)' }
                            },
                            ticks: { color: '#aaa', maxRotation: 45, minRotation: 45 },
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            ticks: { color: '#00ff00' },
                            grid: { color: 'rgba(0, 255, 0, 0.1)' },
                            title: { display: true, text: 'Enlem', color: '#00ff00' }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            ticks: { color: '#ffff00' },
                            grid: { drawOnChartArea: false },
                            title: { display: true, text: 'Boylam', color: '#ffff00' }
                        }
                    }
                }
            });

            const mapCtx = document.getElementById('mapChart').getContext('2d');
            mapChart = new Chart(mapCtx, {
                type: 'line', 
                data: {
                    datasets: [{
                        label: 'Deprem Konumu',
                        data: mapData,
                        borderColor: 'rgba(255, 255, 255, 0.4)', // Zamanı bağlayan beyaz çizgi
                        borderWidth: 1,
                        backgroundColor: '#ff00ff', // Varsayılan renk
                        pointRadius: mapData.map(d => Math.max(3, d.mag * 2)), // Nokta boyutu (büyüklüğe göre)
                        pointBackgroundColor: mapData.map(d => d.mag >= 3 ? '#ff3232' : (d.mag >= 2 ? '#ffa500' : '#00ffff')),
                        pointBorderColor: '#fff',
                        showLine: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const pt = context.raw;
                                    return `Zaman: ${pt.time} | Büyüklük: ${pt.mag} | Konum: ${pt.y.toFixed(4)}, ${pt.x.toFixed(4)}`;
                                }
                            }
                        },
                        zoom: {
                            zoom: {
                                wheel: { enabled: true },
                                pinch: { enabled: true },
                                mode: 'xy'
                            },
                            pan: {
                                enabled: true,
                                mode: 'xy'
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            title: { display: true, text: 'Boylam (X)', color: '#ffff00' },
                            ticks: { color: '#ffff00' },
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        },
                        y: {
                            type: 'linear',
                            title: { display: true, text: 'Enlem (Y)', color: '#00ff00' },
                            ticks: { color: '#00ff00' },
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        }
                    }
                }
            });
        }

        loadChart();
    </script>
</body>
</html>
